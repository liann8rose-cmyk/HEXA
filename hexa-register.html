<!DOCTYPE html>
<html lang="en" style="background:#000;">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
(function(){
  if(sessionStorage.getItem('hexa_back_from_dashboard')){
    sessionStorage.removeItem('hexa_back_from_dashboard');
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.3, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>HEXA · Register</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
  *:focus-visible { outline: none; }

  html {
    background: #000;
  }

  html, body {
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    background: #000;
    color: #fff;
    font-family: 'Barlow', sans-serif;
    scroll-behavior: auto;
    scrollbar-gutter: stable;
  }
  body.not-ready {
    visibility: hidden !important;
    opacity: 0 !important;
  }
  body.ready {
    visibility: visible;
    opacity: 1;
  }

  /* ── CANVAS BACKGROUND ── */
  #hexCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    /* GPU-pin to stable layer — prevents Samsung compositor reuse artifact */
    transform: translate3d(0,0,0);
    -webkit-transform: translate3d(0,0,0);
    background: #000 !important;
  }

  /* ── GPU LAYER PINNING — keeps layers alive during rotation ── */
  .page,
  .center-col {
    transform: translate3d(0,0,0);
    -webkit-transform: translate3d(0,0,0);
  }
  .center-col {
    contain: layout paint;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  /* ── BLACK OVERLAY — hidden on load ── */
  #blackOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 999999;
    pointer-events: none;
    opacity: 1;
    transition: none;
  }
  /* Fade out once page settles */
  html.page-settled #blackOverlay {
    opacity: 0;
    transition: opacity 0.15s linear;
  }

  /* ── PAGE — base structure ── */
  html {
    background: #000 !important;
  }
  html, body {
    overflow: hidden !important;
    height: 100svh !important;  /* svh = stable during rotation, dvh shifts */
  }
  .page {
    position: relative;
    z-index: 10;
    height: 100svh;             /* svh not dvh */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0;
    width: 100%;
    box-sizing: border-box;
  }
  .center-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 520px;
    padding: 0 6px;
    margin: 0 auto;
    text-align: center;
    transform-origin: center center;
  }

  /* ── LOGO ── */
  .logo-area {
    position: relative;
    width: 70%;
    max-width: 200px;
    height: 70px;
    margin: 12px 0 2px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  #logoCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
  }

  .logo-text {
    position: relative;
    z-index: 2;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #fff 30%, #00f0ff 70%, #ff00ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 15px rgba(0,240,255,0.6));
    animation: logoPulse 3s ease-in-out infinite;
    white-space: nowrap;
  }

  @keyframes logoPulse {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(0,240,255,0.5)); }
    50% { filter: drop-shadow(0 0 24px rgba(255,0,255,0.7)); }
  }

  .subtitle {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 9px;
    letter-spacing: 0.55em;
    color: #00f0ff;
    margin-bottom: 4px;
    margin-top: 2px;
    opacity: 0.9;
    text-transform: uppercase;
  }

  /* ── TAB ROW ── */
  .tab-row {
    display: flex;
    gap: 6px;
    width: 100%;
    margin-bottom: 7px;
  }

  .tab-btn {
    flex: 1;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    padding: 8px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, #00f0ff, #0077cc);
    color: #000;
    border: none;
  }

  .tab-btn.inactive {
    background: transparent;
    color: #ff00ff;
    border: 1px solid rgba(255,0,255,0.5);
  }

  .tab-btn.inactive:hover { border-color: #7700ff; color: #7700ff; }

  /* ── CARD ── */
  .card {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(0,240,255,0.25);
    border-radius: 4px;
    padding: 12px 16px;
    animation: fadeIn 0.5s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.25em;
    color: #fff;
    margin-bottom: 8px;
    text-align: center;
  }

  /* ── FIELDS ── */
  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px 10px;
    margin-bottom: 8px;
  }

  .field-full { grid-column: 1 / -1; }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.95);
    margin-bottom: 5px;
    font-weight: 600;
  }

  .field input, .field select {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 2px;
    padding: 8px 10px;
    color: #fff;
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  .field select { cursor: pointer; }
  .field input:focus, .field select:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.12); }
  .field input::placeholder { color: rgba(255,255,255,0.65); }

  .field-note { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 3px; }
  .age-note { font-size: 11px; color: #ff4466; margin-top: 3px; display: none; }

  .pw-wrap { position: relative; display: flex; align-items: center; }
  .pw-wrap input { flex: 1; padding-right: 30px; }
  .pw-eye { position: absolute; right: 8px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,.85); user-select: none; -webkit-user-select: none; }

  .strength-track { height: 2px; background: rgba(255,255,255,0.07); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .strength-bar { height: 100%; width: 0%; border-radius: 2px; transition: width .3s, background-color .3s; }
  .strength-label { font-size: 8px; letter-spacing: .1em; color: rgba(255,255,255,.6); margin-top: 2px; }

  /* ── REGISTER BUTTON ── */
  .btn-register {
    width: 100%;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.25em;
    padding: 10px;
    background: linear-gradient(135deg, #00f0ff, #0077cc);
    color: #000;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    margin-bottom: 8px;
    margin-top: 2px;
  }

  .btn-register::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #ff00ff, #7700ff); opacity: 0; transition: opacity 0.4s; }
  .btn-register:hover::after { opacity: 1; }
  .btn-register span { position: relative; z-index: 1; color: #000; }
  .btn-register:hover span { color: #fff; }
  .btn-register:hover { transform: translateY(-1px); box-shadow: 0 0 20px rgba(0,240,255,0.3); }

  .signin-link { text-align: center; font-size: 13px; color: rgba(255,255,255,0.85); }
  .signin-link a { color: #ff00ff; text-decoration: none; font-weight: 600; }
  .signin-link a:hover { color: #00f0ff; }

  /* ── SUCCESS ── */
  .success { display: none; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 10px 0; }
  .success-hex { font-size: 40px; animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.2em; color: #00f0ff; }
  .success p { font-size: 11px; color: rgba(255,255,255,0.8); line-height: 1.6; }

  .back-link { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,0.75); letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: block; text-align: center; }
  .back-link:hover { color: #00f0ff; }

  /* ── MODAL BASE — always centered, always fixed ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
    padding: 16px;
  }
  .modal-overlay.on { display: flex; }

  .modal-box {
    background: rgba(0,3,15,0.97);
    border: 1px solid rgba(0,240,255,.35);
    border-radius: 4px;
    padding: 28px;
    width: 100%;
    max-width: 340px;
    position: relative;
    box-shadow: 0 0 40px rgba(0,240,255,0.08);
    margin: auto;
  }

  .modal-box h2 { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.25em; color:#fff; margin-bottom:18px; text-align:center; }
  .modal-close { position:absolute; top:10px; right:14px; background:none; border:none; color:rgba(255,255,255,.65); font-size:18px; cursor:pointer; }

  .login-field { margin-bottom: 12px; }
  .login-field label { display:block; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.75); margin-bottom:5px; }
  .login-field input { width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.2); border-radius:2px; padding:9px 12px; color:#fff; font-family:'Barlow',sans-serif; font-size:13px; outline:none; }
  .login-field input:focus { border-color:#00f0ff; }

  .login-remember { padding: 4px 0 8px; }
  .login-btn { width:100%; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:.2em; padding:11px; background:linear-gradient(135deg,#00f0ff,#0077cc); color:#000; border:none; border-radius:2px; cursor:pointer; margin-top:6px; }
  .login-pw-wrap { position:relative; display:flex; align-items:center; }
  .login-pw-wrap input { flex:1; padding-right:38px; }
  .login-pw-eye { position:absolute; right:10px; cursor:pointer; font-size:15px; color:rgba(255,255,255,.85); user-select:none; }
  .forgot-link { display:block; text-align:right; font-size:10px; letter-spacing:.1em; color:rgba(0,240,255,.55); cursor:pointer; margin-top:4px; text-decoration:none; text-transform:uppercase; }
  .forgot-link:hover { color:#00f0ff; }
  .login-error { color:#ff4466; font-size:11px; margin-top:7px; text-align:center; display:none; }
  .login-success { color:#00ff88; font-size:11px; margin-top:7px; text-align:center; display:none; }

  /* ── RESET MODAL ── */
  .reset-box h2 { font-size:18px; color:#00f0ff; margin-bottom:3px; }
  .reset-subtitle { font-family:'Bebas Neue',sans-serif; font-size:9px; letter-spacing:.15em; color:rgba(255,255,255,.65); text-align:center; margin-bottom:16px; text-transform:uppercase; }
  .reset-field { margin-bottom:11px; }
  .reset-field label { display:block; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.75); margin-bottom:5px; }
  .reset-field input { width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.2); border-radius:2px; padding:9px 12px; color:#fff; font-family:'Barlow',sans-serif; font-size:13px; outline:none; transition:border-color .2s; }
  .reset-field input:focus { border-color:#00f0ff; }
  .reset-btn { width:100%; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:.2em; padding:11px; background:linear-gradient(135deg,#00f0ff,#0077cc); color:#000; border:none; border-radius:2px; cursor:pointer; margin-top:4px; }
  .reset-btn:disabled { opacity:.35; cursor:not-allowed; }
  .reset-error { color:#ff4466; font-size:10px; margin-top:4px; display:none; }
  .reset-back-link { display:block; text-align:center; font-size:10px; letter-spacing:.12em; color:rgba(0,240,255,.5); cursor:pointer; margin-top:12px; text-transform:uppercase; }
  .reset-back-link:hover { color:#00f0ff; }
  .reset-success { color:#00ff88; font-size:11px; text-align:center; margin-top:8px; display:none; }
</style>
</head>

<body class="not-ready" style="background:#000;">

<canvas id="hexCanvas"></canvas>
<div id="blackOverlay"></div>

<div class="page">
  <div class="center-col">

    <div class="logo-area" onclick="window.location.replace('index.html')" style="cursor:pointer;">
      <canvas id="logoCanvas"></canvas>
      <div class="logo-text">HEXA</div>
    </div>

    <div class="subtitle">Create Your Account</div>

    <div class="tab-row">
      <button class="tab-btn active">REGISTER</button>
      <button class="tab-btn inactive" onclick="openLoginModal()">SIGN IN</button>
    </div>

    <div class="card" id="formCard">
      <input type="text" style="display:none;" name="prevent_autofill" autocomplete="off"/>
      <input type="password" style="display:none;" name="prevent_autofill_pw" autocomplete="new-password"/>
      <div class="card-title">Join HEXA</div>

      <div class="fields-grid">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="fullname" placeholder="Your name" autocomplete="off" name="hexa_fullname" readonly onfocus="this.removeAttribute('readonly')" />
        </div>

        <div class="field">
          <label>Username</label>
          <input type="text" id="username" placeholder="user_handle" autocomplete="off" name="hexa_handle" readonly onfocus="this.removeAttribute('readonly')" oninput="this.value=this.value.replace(/\s/g,'_');checkUsernameAvailability(this.value)" />
          <div class="field-note" id="username-status">Public display name</div>
        </div>

        <div class="field">
          <label>Age</label>
          <input type="number" id="age" placeholder="Age" min="1" max="120" />
          <div class="age-note" id="ageNote">⚠ Must be 18+</div>
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email" placeholder="your@email.com" autocomplete="email" name="email" />
        </div>

        <div class="field">
          <label>Country</label>
          <select id="country" required>
            <option value="">Select Country</option>
            <option value="🇪🇪">🇪🇪 Estonia</option>
            <option value="🇫🇷">🇫🇷 France</option>
            <option value="🇺🇸">🇺🇸 United States</option>
            <option value="🇬🇧">🇬🇧 United Kingdom</option>
            <option value="🇩🇪">🇩🇪 Germany</option>
            <option value="🇫🇮">🇫🇮 Finland</option>
            <option value="🇸🇪">🇸🇪 Sweden</option>
            <option value="🇯🇵">🇯🇵 Japan</option>
            <option value="🇰🇷">🇰🇷 Korea South</option>
          </select>
        </div>

        <div class="field field-full">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" name="password" oninput="checkStrength()" />
            <span class="pw-eye" id="pw-eye" onclick="var i=document.getElementById('password'),e=document.getElementById('pw-eye');i.type=i.type==='password'?'text':'password';e.textContent=i.type==='password'?'👁':'🙈';">👁</span>
          </div>
          <div class="strength-track"><div class="strength-bar" id="strengthBar"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>

        <div class="field field-full">
          <label>Security Question <span style="color:rgba(255,255,255,0.45);font-size:9px;letter-spacing:0.1em;">— recover your account if you forget password</span></label>
          <input type="text" id="securityQuestion" placeholder="e.g. What was the name of your first pet?" autocomplete="off" />
        </div>

        <div class="field field-full">
          <label>Security Answer</label>
          <input type="text" id="securityAnswer" placeholder="Your answer" autocomplete="off" />
          <div class="field-note">Answer is case-insensitive</div>
        </div>
      </div>

      <button class="btn-register" id="regBtn" onclick="handleRegister()">
        <span>Create Account</span>
      </button>

      <div class="signin-link" id="signInLinkRow">
        Already a member? <a href="#" onclick="openLoginModal();return false;">Sign In</a>
      </div>

      <div class="success" id="successMsg">
        <div class="success-hex">⬡</div>
        <h3>Welcome to HEXA</h3>
        <p>Your account has been created.<br>You're now part of the HEXA community.</p>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeLoginModal()">✕</button>
    <h2>Sign In</h2>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" name="email" />
    </div>
    <div class="login-field">
      <label>Password</label>
      <div class="login-pw-wrap">
        <input type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password" name="password" onkeydown="if(event.key==='Enter') submitLogin()" />
        <span class="login-pw-eye" id="login-pw-eye" onclick="var i=document.getElementById('loginPassword'),e=document.getElementById('login-pw-eye');i.type=i.type==='password'?'text':'password';e.textContent=i.type==='password'?'👁':'🙈';">👁</span>
      </div>
      <a class="forgot-link" onclick="openResetModal()">Forgot password?</a>
    </div>
    <div class="login-remember">
      <label style="display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.5);cursor:pointer;letter-spacing:.08em;">
        <input type="checkbox" id="rememberMe" style="accent-color:#00f0ff;width:14px;height:14px;cursor:pointer;" />
        REMEMBER ME
      </label>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="login-success" id="loginSuccess"></div>
    <button class="login-btn" onclick="submitLogin()">SIGN IN</button>
  </div>
</div>

<div class="modal-overlay" id="resetModal">
  <div class="modal-box reset-box">
    <button class="modal-close" onclick="closeResetModal()">✕</button>
    <h2>🔑 RESET PASSWORD</h2>
    <p class="reset-subtitle">Enter your email and new password</p>
    <div class="reset-field">
      <label>Email Address</label>
      <input type="email" id="resetEmail" placeholder="your@email.com" />
      <div class="reset-error" id="resetEmailError"></div>
    </div>
    <div class="reset-field">
      <label>New Password</label>
      <div class="login-pw-wrap">
        <input type="password" id="resetNewPassword" placeholder="New password" oninput="checkResetStrength()" />
        <span class="login-pw-eye" onclick="var i=document.getElementById('resetNewPassword');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈';">👁</span>
      </div>
      <div style="height:2px;background:rgba(255,255,255,0.07);border-radius:2px;margin-top:5px;overflow:hidden;">
        <div id="resetStrengthBar" style="height:100%;width:0%;border-radius:2px;transition:width .3s,background-color .3s;"></div>
      </div>
      <div id="resetStrengthText" style="font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.3);margin-top:2px;"></div>
      <div class="reset-error" id="resetNewPasswordError"></div>
    </div>
    <div class="reset-field">
