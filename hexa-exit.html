<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEXA · Exit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.3;
  }

  /* TOP LEFT — X button area */
  .hint-top-left {
    position: fixed;
    top: 24px;
    left: 20px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    animation: fadeIn 1.4s ease forwards;
    opacity: 0;
  }

  .hint-top-left svg {
    width: 28px;
    height: 28px;
    stroke: #00f0ff;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: blink 2.5s ease-in-out infinite;
  }

  .hint-top-left span {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: rgba(0,240,255,0.8);
  }



  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
    padding: 40px 32px;
    animation: fadeIn 1s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .you-left {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(24px, 6vw, 38px);
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.75);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 22vw, 200px);
    letter-spacing: 0.15em;
    line-height: 1;
    background: linear-gradient(135deg, #fff 30%, #00f0ff 70%, #ff00ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(0,240,255,0.5));
    opacity: 0.7;
  }

  .divider {
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00f0ff, #ff00ff, transparent);
  }

  @media (orientation: landscape) {
    .logo {
      font-size: clamp(48px, 18vh, 120px);
    }
    .you-left {
      font-size: clamp(16px, 4vh, 28px);
    }
    .content {
      gap: 10px;
      padding: 20px 32px;
    }
  }

</style>
</head>
<body>

<div class="hint-top-left">
  <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
  <span>EXIT</span>
</div>

<canvas id="hexCanvas"></canvas>





<div class="content">
  <div class="you-left">YOU HAVE LEFT</div>
  <div class="logo">HEXA</div>
  <div class="divider"></div>
</div>

<script>
const canvas = document.getElementById('hexCanvas');
const ctx = canvas.getContext('2d');
let W, H, hexes = [];

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildHexes();
}

function buildHexes(){
  hexes = [];
  const size = 36, cols = Math.ceil(W/(size*1.8))+2, rows = Math.ceil(H/(size*1.6))+2;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const x = c*size*1.75 + (r%2)*size*0.87;
    const y = r*size*1.52;
    hexes.push({x,y,size,alpha:Math.random()*0.15+0.03,speed:Math.random()*0.004+0.001,t:Math.random()*Math.PI*2});
  }
}

function drawHex(x,y,s,alpha){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = Math.PI/180*(60*i-30);
    i===0?ctx.moveTo(x+s*Math.cos(a),y+s*Math.sin(a)):ctx.lineTo(x+s*Math.cos(a),y+s*Math.sin(a));
  }
  ctx.closePath();
  ctx.strokeStyle=`rgba(0,240,255,${alpha})`;
  ctx.lineWidth=0.6;
  ctx.stroke();
}

function animate(){
  ctx.clearRect(0,0,W,H);
  hexes.forEach(h=>{ h.t+=h.speed; h.alpha=0.03+Math.abs(Math.sin(h.t))*0.12; drawHex(h.x,h.y,h.size,h.alpha); });
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
animate();

// Back gesture / Android back triangle: no custom handling here any more. It does what the X does --
// the browser leaves HEXA and returns to wherever it was started from (when this page is the first
// page in the window's history, which is the case when every step before it used a replace-style
// redirect). The old handler that sent back-presses to index.html is removed.

// After 3 seconds, close HEXA by itself when that is possible (the installed app, or a window the
// browser allows to be closed). A web page has no single standard way to close an app, so every
// common route is tried; each one is harmless if it does not exist here. If none of them works,
// this page simply stays on screen as before and the person leaves with the X / back button.
function hexaTryClose(){
  var tries = [
    function(){ if(window.Android && Android.exitApp) Android.exitApp(); },
    function(){ if(window.Android && Android.closeApp) Android.closeApp(); },
    function(){ if(window.Android && Android.finish) Android.finish(); },
    function(){ if(window.AndroidBridge && AndroidBridge.exitApp) AndroidBridge.exitApp(); },
    function(){ if(window.HexaApp && HexaApp.exitApp) HexaApp.exitApp(); },
    function(){ if(window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App && Capacitor.Plugins.App.exitApp) Capacitor.Plugins.App.exitApp(); },
    function(){ if(navigator.app && navigator.app.exitApp) navigator.app.exitApp(); },
    function(){ window.close(); }
  ];
  tries.forEach(function(f){ try { f(); } catch(e){} });
}
setTimeout(hexaTryClose, 3000);
</script>
</body>
</html>
