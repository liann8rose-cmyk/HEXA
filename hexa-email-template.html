<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* Shrinks the email content in landscape so there's less to scroll through.
     Supported by Apple Mail, Gmail app, Outlook mobile. Clients that ignore
     @media (e.g. Outlook desktop) simply keep the normal portrait sizing below —
     this never breaks, it's a best-effort enhancement. */
  @media (orientation: landscape) {
    .hexa-logo { font-size: 26px !important; letter-spacing: 7px !important; }
    .hexa-label { font-size: 9px !important; letter-spacing: 3px !important; }
    .hexa-code-box { padding: 20px 14px !important; }
    .hexa-code { font-size: 28px !important; letter-spacing: 9px !important; }
    .hexa-outer { padding: 24px 20px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#00030a;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" class="hexa-outer" style="background:#00030a;padding:50px 20px;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width:420px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:6px;">
              <span class="hexa-logo" style="font-size:36px;font-weight:900;letter-spacing:10px;color:#00ffee;">HEXA</span>
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td align="center" style="padding-bottom:36px;">
              <span class="hexa-label" style="font-size:11px;letter-spacing:5px;color:#888888;font-family:monospace;">RESET CODE</span>
            </td>
          </tr>

          <!-- Code -->
          <tr>
            <td align="center" class="hexa-code-box" style="background:#001a2e;border:2px solid #00ffee;border-radius:8px;padding:36px 20px;">
              <span class="hexa-code" style="font-size:42px;font-weight:900;letter-spacing:14px;color:#00ffee;font-family:'Courier New',monospace;">{{ .Token }}</span>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
