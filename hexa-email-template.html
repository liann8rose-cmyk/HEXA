<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#00030a;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#00030a;padding:50px 20px;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width:420px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:6px;">
              <span style="font-size:36px;font-weight:900;letter-spacing:10px;color:#00ffee;">HEXA</span>
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td align="center" style="padding-bottom:36px;">
              <span style="font-size:11px;letter-spacing:5px;color:#888888;font-family:monospace;">RESET CODE</span>
            </td>
          </tr>

          <!-- Code -->
          <tr>
            <td align="center" style="background:#001a2e;border:2px solid #00ffee;border-radius:8px;padding:36px 20px;">
              <span style="font-size:42px;font-weight:900;letter-spacing:14px;color:#00ffee;font-family:'Courier New',monospace;">{{ .Token }}</span>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
